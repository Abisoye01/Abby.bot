[tool.poetry]
name = "abby-bot"
version = "0.1.0"
description = "Merged Highrise bot"
authors = ["Abisoye01 <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10.0,<3.11"
highrise-bot-sdk = "23.3.4"
flask = "3.0.0"
python-dotenv = "^1.0.1"

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
